name: Build and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: classroom_test
          POSTGRES_PASSWORD: local_ci_test_only
          POSTGRES_DB: gpt_classroom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U classroom_test -d gpt_classroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify classroom against PostgreSQL
        run: node --test tests/classroom.test.js
        env:
          CLASSROOM_TEST_DATABASE_URL: postgresql://classroom_test:local_ci_test_only@127.0.0.1:5432/gpt_classroom_test
      - run: npm run build
        env:
          VITE_ENABLE_GEMINI: 'false'
          VITE_CLASSROOM_URL: ${{ vars.CLASSROOM_URL || 'https://gpt-learning-classroom.onrender.com' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

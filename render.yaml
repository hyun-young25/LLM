# Free short-term classroom: database expires 30 days after creation.
# Export student records before expiry. No paid service or disk is declared.
services:
  - type: web
    name: gpt-learning-classroom
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: node server.mjs
    healthCheckPath: /api/classroom/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CLASSROOM_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: gpt-learning-records
          property: connectionString
      - key: CLASSROOM_STORAGE_NOTICE
        value: "무료 데이터베이스는 생성 후 30일에 만료됩니다. 만료 전에 전체 기록을 내려받아 주세요."
      - key: ADMIN_LOGIN
        value: instructor
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: VITE_ENABLE_GEMINI
        value: "false"
databases:
  - name: gpt-learning-records
    plan: free
    region: singapore
    databaseName: gpt_classroom
    ipAllowList: []
